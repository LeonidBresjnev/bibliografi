name: Update bibliography

on:
  push:
    paths:
      - "**/*.bib"
      - "bibliography-styles.tsv"
      - ".github/workflows/update-bibliography.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-bibliography:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install BibTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base pandoc

      - name: Generate bibliography sections in README with BibTeX
        run: |
          set -euo pipefail

          BIB_FILE="$(git ls-files '*.bib' | head -n 1)"
          if [ -z "${BIB_FILE}" ]; then
            echo "No .bib file found in repository."
            exit 1
          fi

          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "${WORKDIR}"' EXIT
          cp "${BIB_FILE}" "${WORKDIR}/references.bib"

          cp bibliography-styles.tsv "${WORKDIR}/styles.tsv"
          sed -i -e 's/^[[:space:]]*//' -e '/^$/d' "${WORKDIR}/styles.tsv"

          while IFS=$'\t' read -r style_id style_label style_url; do
            curl -fsSL "${style_url}" -o "${WORKDIR}/${style_id}.bst"
          done < "${WORKDIR}/styles.tsv"

          generate_style() {
            local style_id="$1"

            {
              echo '\documentclass{article}'
              echo '\begin{document}'
              echo '\nocite{*}'
              echo "\\bibliographystyle{${style_id}}"
              echo '\bibliography{references}'
              echo '\end{document}'
            } > "${WORKDIR}/${style_id}.tex"

            pushd "${WORKDIR}" >/dev/null
            latex -interaction=nonstopmode "${style_id}.tex" >/dev/null
            bibtex "${style_id}" >/dev/null
            popd >/dev/null

            pandoc --from=latex --to=gfm "${WORKDIR}/${style_id}.bbl" -o "${WORKDIR}/${style_id}.md"
            sed -i \
              -e '/^<div class="thebibliography">$/d' \
              -e '/^<\/div>$/d' \
              -e '/^[0-9][0-9]*$/d' \
              "${WORKDIR}/${style_id}.md"
          }

          render_style() {
            local style_id="$1"
            local label="$2"
            local anchor_id="$3"
            local open_attr="${4:-}"

            echo "<details${open_attr} id=\"${anchor_id}\">"
            echo "<summary><strong>${label}</strong></summary>"
            echo
            cat "${WORKDIR}/${style_id}.md"
            echo
            echo "</details>"
            echo
          }

          while IFS=$'\t' read -r style_id style_label style_url; do
            generate_style "${style_id}"
          done < "${WORKDIR}/styles.tsv"

          : > "${WORKDIR}/style-radio-chooser.md"
          : > "${WORKDIR}/style-sections.md"
          is_first=1
          while IFS=$'\t' read -r style_id style_label style_url; do
            anchor_id="bibliography-style-${style_id}"
            checked_attr=""
            open_attr=""
            if [ "${is_first}" -eq 1 ]; then
              checked_attr=" checked"
              open_attr=" open"
              is_first=0
            fi

            printf '<input type="radio" name="bibliography-style" id="%s"%s /> <label for="%s"><a href="#%s">%s</a></label><br/>\n' \
              "${anchor_id}" "${checked_attr}" "${anchor_id}" "${anchor_id}" "${style_label}" \
              >> "${WORKDIR}/style-radio-chooser.md"

            render_style "${style_id}" "${style_label}" "${anchor_id}" "${open_attr}" \
              >> "${WORKDIR}/style-sections.md"
          done < "${WORKDIR}/styles.tsv"

          {
            echo "<!-- bibliography:start -->"
            echo "_Generated with BibTeX from \`${BIB_FILE}\`._"
            echo
            echo "Choose a journal style:"
            echo
            cat "${WORKDIR}/style-radio-chooser.md"
            echo
            cat "${WORKDIR}/style-sections.md"
            echo "<!-- bibliography:end -->"
          } > "${WORKDIR}/bibliography-section.md"

          if [ -f README.md ]; then
            if grep -q "<!-- bibliography:start -->" README.md && grep -q "<!-- bibliography:end -->" README.md; then
              awk '
                BEGIN { inside = 0 }
                /<!-- bibliography:start -->/ {
                  inside = 1
                  while ((getline line < section) > 0) print line
                  close(section)
                  next
                }
                /<!-- bibliography:end -->/ {
                  inside = 0
                  next
                }
                !inside { print }
              ' section="${WORKDIR}/bibliography-section.md" README.md > "${WORKDIR}/README.md"
            else
              cp README.md "${WORKDIR}/README.md"
              {
                echo
                echo "## Publications"
                echo
                cat "${WORKDIR}/bibliography-section.md"
              } >> "${WORKDIR}/README.md"
            fi
          else
            {
              echo "# Bibliography"
              echo
              echo "## Publications"
              echo
              cat "${WORKDIR}/bibliography-section.md"
            } > "${WORKDIR}/README.md"
          fi
          mv "${WORKDIR}/README.md" README.md

      - name: Commit README changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update bibliography in README"
          git push
