name: Update bibliography

on:
  push:
    paths:
      - "**/*.bib"
      - ".github/workflows/update-bibliography.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-bibliography:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install BibTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base pandoc

      - name: Generate bibliography sections in README with BibTeX
        run: |
          set -euo pipefail

          BIB_FILE="$(git ls-files '*.bib' | head -n 1)"
          if [ -z "${BIB_FILE}" ]; then
            echo "No .bib file found in repository."
            exit 1
          fi

          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "${WORKDIR}"' EXIT
          cp "${BIB_FILE}" "${WORKDIR}/references.bib"

          curl -fsSL \
            "https://raw.githubusercontent.com/louisahsmith/louisahstuff/75ee938ce59551999e17145580de2aec33add646/inst/rmarkdown/resources/epi-custom.bst" \
            -o "${WORKDIR}/epidemiology.bst"
          curl -fsSL \
            "https://raw.githubusercontent.com/sachsmc/pandoc-journal-templates/c63a6845dc21dc422ccbea7cb86a54d875ca8a5a/stats-in-med/statmed.bst" \
            -o "${WORKDIR}/statmed.bst"
          curl -fsSL \
            "https://raw.githubusercontent.com/sachsmc/pandoc-journal-templates/c63a6845dc21dc422ccbea7cb86a54d875ca8a5a/biometrika/biometrika.bst" \
            -o "${WORKDIR}/biometrika.bst"

          generate_style() {
            local style_id="$1"

            {
              echo '\documentclass{article}'
              echo '\begin{document}'
              echo '\nocite{*}'
              echo "\\bibliographystyle{${style_id}}"
              echo '\bibliography{references}'
              echo '\end{document}'
            } > "${WORKDIR}/${style_id}.tex"

            pushd "${WORKDIR}" >/dev/null
            latex -interaction=nonstopmode "${style_id}.tex" >/dev/null
            bibtex "${style_id}" >/dev/null
            popd >/dev/null

            pandoc --from=latex --to=gfm "${WORKDIR}/${style_id}.bbl" -o "${WORKDIR}/${style_id}.md"
          }

          render_style() {
            local style_id="$1"
            local label="$2"
            local open_attr="${3:-}"

            echo "<details${open_attr}>"
            echo "<summary><strong>${label}</strong></summary>"
            echo
            cat "${WORKDIR}/${style_id}.md"
            echo
            echo "</details>"
            echo
          }

          generate_style epidemiology
          generate_style statmed
          generate_style biometrika

          {
            echo "<!-- bibliography:start -->"
            echo "_Generated with BibTeX from \`${BIB_FILE}\`._"
            echo
            echo "Choose a journal style:"
            echo
            render_style epidemiology "Epidemiology" " open"
            render_style statmed "Statistics in Medicine"
            render_style biometrika "Biometrika"
            echo "<!-- bibliography:end -->"
          } > "${WORKDIR}/bibliography-section.md"

          if [ -f README.md ]; then
            if grep -q "<!-- bibliography:start -->" README.md && grep -q "<!-- bibliography:end -->" README.md; then
              awk '
                BEGIN { inside = 0 }
                /<!-- bibliography:start -->/ {
                  inside = 1
                  while ((getline line < section) > 0) print line
                  close(section)
                  next
                }
                /<!-- bibliography:end -->/ {
                  inside = 0
                  next
                }
                !inside { print }
              ' section="${WORKDIR}/bibliography-section.md" README.md > "${WORKDIR}/README.md"
            else
              cp README.md "${WORKDIR}/README.md"
              {
                echo
                echo "## Publications"
                echo
                cat "${WORKDIR}/bibliography-section.md"
              } >> "${WORKDIR}/README.md"
            fi
          else
            {
              echo "# Bibliography"
              echo
              echo "## Publications"
              echo
              cat "${WORKDIR}/bibliography-section.md"
            } > "${WORKDIR}/README.md"
          fi
          mv "${WORKDIR}/README.md" README.md

      - name: Commit README changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update bibliography in README"
          git push
