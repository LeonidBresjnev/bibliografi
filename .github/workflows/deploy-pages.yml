name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "**/*.bib"
      - "bibliography-styles.tsv"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install BibTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base pandoc

      - name: Generate bibliography data with BibTeX
        run: |
          set -euo pipefail

          BIB_FILE="$(git ls-files '*.bib' | head -n 1)"
          if [ -z "${BIB_FILE}" ]; then
            echo "No .bib file found in repository."
            exit 1
          fi

          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "${WORKDIR}"' EXIT
          cp "${BIB_FILE}" "${WORKDIR}/references.bib"

          cp bibliography-styles.tsv "${WORKDIR}/styles.tsv"
          sed -i -e 's/^[[:space:]]*//' -e '/^$/d' "${WORKDIR}/styles.tsv"

          while IFS=$'\t' read -r style_id style_label style_url; do
            curl -fsSL "${style_url}" -o "${WORKDIR}/${style_id}.bst"
          done < "${WORKDIR}/styles.tsv"

          generate_style() {
            local style_id="$1"

            {
              echo '\documentclass{article}'
              echo '\begin{document}'
              echo '\nocite{*}'
              echo "\\bibliographystyle{${style_id}}"
              echo '\bibliography{references}'
              echo '\end{document}'
            } > "${WORKDIR}/${style_id}.tex"

            pushd "${WORKDIR}" >/dev/null
            latex -interaction=nonstopmode "${style_id}.tex" >/dev/null
            bibtex "${style_id}" >/dev/null
            popd >/dev/null
          }

          while IFS=$'\t' read -r style_id style_label style_url; do
            generate_style "${style_id}"
          done < "${WORKDIR}/styles.tsv"

          mkdir -p public
          WORKDIR="${WORKDIR}" BIB_FILE="${BIB_FILE}" node scripts/render-bibliography.mjs site

      - name: Install npm dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
